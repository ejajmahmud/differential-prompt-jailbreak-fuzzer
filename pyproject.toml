[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "differential-prompt-jailbreak-fuzzer"
version = "0.1.0"
description = "Automated genetic mutation fuzzer that stress-tests agent system prompts against mutating jailbreak payloads"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
differential-prompt-jailbreak-fuzzer = "differential_prompt_jailbreak_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["differential_prompt_jailbreak_fuzzer*"]
